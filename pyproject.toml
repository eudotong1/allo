[project]
name = "allo-router"
version = "0.5.0"
description = "Allo Router: the agent router for maximizing usage. Plans which AI plan should take which job before limits reset."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://allorouter.com"
Repository = "https://github.com/eudotong1/allo"
Issues = "https://github.com/eudotong1/allo/issues"

[project.scripts]
allo-router = "allo:cli"

[tool.setuptools]
py-modules = ["allo", "allo_dash", "allo_dash_page", "allo_exec", "allo_live", "allo_report", "allo_sync", "allo_upload"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
